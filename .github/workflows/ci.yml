name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Linux / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:permissions
      - run: npm run typecheck
      - run: npm run build
      - run: npm run audit:public
      - run: npm run smoke:package
      - name: Check tracked files are unchanged
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
  native:
    name: macOS native / Node 24
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run smoke:server
      - run: npm run smoke:permissions
      - run: npm run smoke:cli
      - run: npm run smoke:review
      - run: npm run smoke:controls
      - run: npm run smoke:validation
      - run: npm run smoke:budget
      - run: npm run smoke:tty
      - name: Check tracked files are unchanged
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
